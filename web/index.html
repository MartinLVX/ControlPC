<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ControlPC</title>
  <meta name="theme-color" content="#0a0a0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ControlPC">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icono-180.png">
  <link rel="icon" href="icono-180.png">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <!-- Iconos (trazos al estilo Lucide, licencia ISC) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-apps" viewBox="0 0 24 24"><rect width="7" height="7" x="3" y="3" rx="1.5"/><rect width="7" height="7" x="14" y="3" rx="1.5"/><rect width="7" height="7" x="14" y="14" rx="1.5"/><rect width="7" height="7" x="3" y="14" rx="1.5"/></symbol>
      <symbol id="i-musica" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
      <symbol id="i-equipo" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8M12 17v4"/></symbol>
      <symbol id="i-candado" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
      <symbol id="i-luna" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
      <symbol id="i-reiniciar" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></symbol>
      <symbol id="i-apagar" viewBox="0 0 24 24"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5Z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-pausa" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-anterior" viewBox="0 0 24 24"><path d="M19 20 9 12l10-8v16Z" fill="currentColor" stroke="none"/><path d="M5 19V5"/></symbol>
      <symbol id="i-siguiente" viewBox="0 0 24 24"><path d="m5 4 10 8-10 8V4Z" fill="currentColor" stroke="none"/><path d="M19 5v14"/></symbol>
      <symbol id="i-vol-bajo" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></symbol>
      <symbol id="i-vol-alto" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/></symbol>
      <symbol id="i-silencio" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="m22 9-6 6M16 9l6 6"/></symbol>
      <symbol id="i-salir" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></symbol>
    </defs>
  </svg>

  <!-- Pantalla del PIN -->
  <main id="vista-pin" class="vista" hidden>
    <div class="pin-caja">
      <img src="icono-180.png" alt="" class="pin-logo">
      <h1>ControlPC</h1>
      <p class="tenue">Escribe el PIN que aparece en tu PC.</p>
      <form id="form-pin">
        <input id="campo-pin" type="password" inputmode="numeric" autocomplete="current-password"
               placeholder="PIN" aria-label="PIN" required>
        <button type="submit" class="boton-principal">Entrar</button>
      </form>
      <p id="error-pin" class="error" role="alert"></p>
    </div>
  </main>

  <!-- Panel -->
  <div id="vista-panel" hidden>
    <header class="cabecera">
      <div>
        <p class="estado"><span id="punto" class="punto"></span><span id="texto-estado">Conectando…</span></p>
        <h1 id="nombre-equipo">Mi PC</h1>
      </div>
      <button id="salir" class="boton-redondo" aria-label="Cerrar sesión"><svg><use href="#i-salir"/></svg></button>
    </header>

    <!-- Aplicaciones -->
    <main id="pestana-apps" class="pestana" data-titulo="Aplicaciones">
      <div id="apps" class="rejilla-apps"></div>
    </main>

    <!-- Multimedia -->
    <main id="pestana-multimedia" class="pestana" data-titulo="Multimedia" hidden>
      <section class="reproduciendo">
        <div class="caratula"><img id="portada" alt="" hidden><svg id="portada-vacia"><use href="#i-musica"/></svg></div>
        <div class="pista">
          <p id="pista-titulo" class="pista-titulo">Nada en reproducción</p>
          <p id="pista-artista" class="pista-artista tenue">Reproduce algo en tu PC</p>
          <p id="pista-app" class="pista-app"></p>
        </div>
        <div class="controles">
          <button class="boton-redondo grande" data-accion="anterior" aria-label="Anterior"><svg><use href="#i-anterior"/></svg></button>
          <button id="boton-play" class="boton-play" data-accion="reproducir_pausar" aria-label="Reproducir o pausar"><svg><use href="#i-play"/></svg></button>
          <button class="boton-redondo grande" data-accion="siguiente" aria-label="Siguiente"><svg><use href="#i-siguiente"/></svg></button>
        </div>
      </section>

      <h2>Volumen</h2>
      <div class="volumen">
        <button class="mosaico" data-accion="bajar_volumen" aria-label="Bajar volumen"><svg><use href="#i-vol-bajo"/></svg></button>
        <button class="mosaico" data-accion="silenciar" aria-label="Silenciar"><svg><use href="#i-silencio"/></svg></button>
        <button class="mosaico" data-accion="subir_volumen" aria-label="Subir volumen"><svg><use href="#i-vol-alto"/></svg></button>
      </div>
    </main>

    <!-- Equipo -->
    <main id="pestana-equipo" class="pestana" data-titulo="Equipo" hidden>
      <div class="rejilla-equipo">
        <button class="mosaico" data-accion="bloquear"><svg><use href="#i-candado"/></svg><span>Bloquear</span></button>
        <button class="mosaico" data-accion="suspender" data-confirmar="¿Suspender la PC?"><svg><use href="#i-luna"/></svg><span>Suspender</span></button>
        <button class="mosaico" data-accion="reiniciar" data-confirmar="¿Reiniciar la PC?" data-detalle="Se cerrará todo lo que tengas abierto."><svg><use href="#i-reiniciar"/></svg><span>Reiniciar</span></button>
        <button class="mosaico" data-accion="apagar" data-confirmar="¿Apagar la PC?" data-detalle="Se cerrará todo lo que tengas abierto."><svg><use href="#i-apagar"/></svg><span>Apagar</span></button>
      </div>
    </main>

    <nav class="barra-pestanas" aria-label="Secciones">
      <button data-pestana="apps" class="activa"><svg><use href="#i-apps"/></svg><span>Aplicaciones</span></button>
      <button data-pestana="multimedia"><svg><use href="#i-musica"/></svg><span>Multimedia</span></button>
      <button data-pestana="equipo"><svg><use href="#i-equipo"/></svg><span>Equipo</span></button>
    </nav>
  </div>

  <!-- Confirmación -->
  <div id="confirmacion" class="velo" hidden>
    <div class="hoja" role="dialog" aria-modal="true" aria-labelledby="confirmacion-titulo">
      <p id="confirmacion-titulo" class="hoja-titulo"></p>
      <p id="confirmacion-detalle" class="tenue"></p>
      <button id="confirmacion-si" class="boton-principal"></button>
      <button id="confirmacion-no" class="boton-secundario">Cancelar</button>
    </div>
  </div>

  <div id="aviso" class="aviso-flotante" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
